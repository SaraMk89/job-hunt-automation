
name: Job Alert Automation Cron

on:
  # Schedule trigger using cron syntax
  schedule:
    # Runs Monday through Friday at 08:00 AM & 01:00 PM UTC
    - cron: '0 8,13 * * 1-5'
  
  # Allows manual triggering from the GitHub interface for testing
  workflow_dispatch:

jobs:
  run-job-scanner:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out repository code
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Step 4: Execute the Python scanner script
      - name: Run Job Automation Script
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: python main.py
